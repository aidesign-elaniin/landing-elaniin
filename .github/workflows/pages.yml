# Publishes a static copy of the landing on GitHub Pages, to show the design.
# GitHub Pages has no server: in this copy the contact form posts straight to the n8n webhook
# (repository variable LEAD_WEBHOOK_URL). n8n must allow this origin (Webhook node > Allowed Origins).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # demo under a sub-path: skip the SEO files, they are built for the final domain
      - run: rm -f src/app/sitemap.ts src/app/robots.ts src/app/opengraph-image.tsx
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_LEAD_WEBHOOK_URL: ${{ vars.LEAD_WEBHOOK_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
